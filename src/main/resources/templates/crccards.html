<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>CRC cards</title>
</head>
<body>
	<h2>CRC cards</h2>
	<a th:href="@{'/projects/' + ${projectId} + '/crccards/new'}">New CRC card</a>
	<br>
	<div th:if="${#lists.isEmpty(crccards)}">
		No CRC cards yet.
	</div>
	<br>
	<div th:each="c : ${crccards}">
		<b th:text="${c.className}"></b>
		&nbsp;&nbsp;
		<a th:href="@{'/projects/' + ${projectId} + '/crccards/' + ${c.id} + '/edit'}">Edit</a>
		&nbsp;&nbsp;
		<a th:href="@{'/projects/' + ${projectId} + '/crccards/' + ${c.id} + '/comments'}">Comments</a>
		&nbsp;&nbsp;
		
		<form th:action="@{'/projects/' + ${projectId} + '/crccards/' + ${c.id} + '/delete'}" method="post" style="display:inline;">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
			<button type="submit">Delete</button>
		</form>
		
		<div>
			<div><i>Responsibilities:</i> <span th:text="${c.responsibilities}"></span></div>
			<div><i>Collaborations:</i> <span th:text="${c.collaborations}"></span></div>
		</div>
		<hr>
	</div>
	<br>
	<a href="/projects">Back to Projects</a>
</body>
</html>
