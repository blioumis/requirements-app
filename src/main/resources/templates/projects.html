<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<title>Projects</title>
</head>
<body>
	<div style="display:inline-block; border:1px solid black; padding:6px 12px; margin-bottom:10px;">
		<b th:text="${currentUsername}"></b>
	</div>

	<h1>Projects</h1>
	
	<p th:if="${error}" th:text="${error}"></p>
	
	<h2>Create project</h2>
	<form method="post" th:action="@{/projects}" th:object="${form}">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
		
		<label>Project name</label>
		<input type="text" th:field="*{name}">
		<button type="submit">Create</button>
	</form>
	
	<div th:if="${error}">
		<b th:text="${error}"></b>
	</div>
	
	<h2>List of projects</h2>
	<ul>
		<li th:each="p : ${ownedProjects}">
			<b><span th:text="${p.name}"></span>:</b>
			&nbsp;&nbsp;
			<a th:href="@{'/projects/' + ${p.id} + '/usecases'}">Use Cases</a>
			&nbsp;&nbsp;
			<a th:href="@{'/projects/' + ${p.id} + '/crccards'}">CRC cards</a>
			&nbsp;&nbsp;
			<a th:href="@{'/projects/' + ${p.id} + '/diagrams'}">Diagrams</a>
			&nbsp;&nbsp;
			<a th:href="@{'/projects/' + ${p.id} + '/share'}">Share</a>
			&nbsp;
			<form method="post" th:action="@{/projects/delete}" style="display:inline;">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
				<input type="hidden" name="id" th:value="${p.id}">
				<button type="submit">Delete</button>
			</form>
		</li>
	</ul>

	<h2>Shared projects</h2>
	<ul>
		<li th:each="p : ${sharedProjects}">
			<b><span th:text="${p.name}"></span>:</b>
			&nbsp;&nbsp;
			<a th:href="@{'/projects/' + ${p.id} + '/usecases'}">Use Cases</a>
			&nbsp;&nbsp;
			<a th:href="@{'/projects/' + ${p.id} + '/crccards'}">CRC cards</a>
			&nbsp;&nbsp;
			<a th:href="@{'/projects/' + ${p.id} + '/diagrams'}">Diagrams</a>
			&nbsp;
			<form method="post" th:action="@{/projects/leave}" style="display:inline;">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
				<input type="hidden" name="id" th:value="${p.id}">
				<button type="submit">Leave</button>
			</form>
		</li>
	</ul>
	<br>
	<p><a href="/workspace">Back to Workspace</a></p>
</body>
</html>
