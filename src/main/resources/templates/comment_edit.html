<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Edit Comment</title>
</head>
<body>
	<h1>Edit Comment</h1>

	<form method="post" th:action="@{'/projects/' + ${projectId} + '/comments/' + ${commentId} + '/edit'}" th:object="${form}">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

		<textarea th:field="*{text}" rows="4" cols="60"></textarea>
		<br>
		<button type="submit">Save</button>
	</form>

	<p><a th:href="@{${backUrl}}">Back</a></p>
</body>
</html>
